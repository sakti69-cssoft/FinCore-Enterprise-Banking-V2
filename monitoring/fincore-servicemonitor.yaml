apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fincore-monitor
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: fincore
      instance: fincore-helm

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
