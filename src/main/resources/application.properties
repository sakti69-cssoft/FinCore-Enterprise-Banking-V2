spring.application.name=fincore-enterprise-banking
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fincore_audit}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
info.app.name=FinCore Enterprise Banking V2
info.app.version=2.0.0
fincore.admin.email=${FINCORE_ADMIN_EMAIL:admin@bank.local}
fincore.admin.password=${FINCORE_ADMIN_PASSWORD}
fincore.cors.origins=${FINCORE_CORS_ORIGINS:http://localhost:5173}
