apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-fincore
  labels:
    app: fincore
    instance: {{ .Release.Name }}

spec:
  selector:
    app: fincore
    instance: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}
