apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mongo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo
      instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: mongo
        instance: {{ .Release.Name }}

    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}

          ports:
            - containerPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongo

spec:
  selector:
    app: mongo
    instance: {{ .Release.Name }}

  ports:
    - port: 27017
      targetPort: 27017