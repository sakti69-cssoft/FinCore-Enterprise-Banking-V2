apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql
      instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: mysql
        instance: {{ .Release.Name }}

    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: fincore-secrets
                  key: DB_USERNAME

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fincore-secrets
                  key: DB_PASSWORD

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fincore-secrets
                  key: DB_PASSWORD

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql

spec:
  selector:
    app: mysql
    instance: {{ .Release.Name }}

  ports:
    - port: 3306
      targetPort: 3306